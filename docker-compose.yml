# Full stack: MongoDB + one app container (Express serves the API and the React build).
#
#   1. cp server/.env.example server/.env   → set OPENROUTER_API_KEY and JWT_SECRET
#   2. docker compose up --build
#   3. open http://localhost:8080
#
# Optional overrides (shell or a root .env file):
#   APP_PORT=8080                       public port of the app
#   MONGO_URI=mongodb+srv://...         use MongoDB Atlas instead of the local container

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Not published to the host: only the app needs it (and it avoids clashing
    # with a MongoDB already running on 27017).

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:5000"
    env_file:
      - path: ./server/.env # secrets: JWT_SECRET, OPENROUTER_API_KEY, ...
        required: false
    environment:
      # Infrastructure settings override whatever is in server/.env.
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/support-agent}
      CORS_ORIGINS: http://localhost:${APP_PORT:-8080}
      APP_URL: http://localhost:${APP_PORT:-8080}
      COOKIE_SAMESITE: lax
      # Served over plain http://localhost here; use HTTPS + "true" when deployed.
      COOKIE_SECURE: "false"
      # Nothing sits in front of the app locally → don't trust X-Forwarded-For.
      TRUST_PROXY: 0
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
